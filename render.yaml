# Render Blueprint: creates the website and its PostgreSQL database in one go.
databases:
  - name: xyz-db
    plan: free
    databaseName: xyz
    user: xyz

services:
  - type: web
    name: xyz-technologies
    runtime: python
    plan: free              # change to "starter" for an always-on site that can send email
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /healthz/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DATABASE_URL
        fromDatabase:
          name: xyz-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "True"
      # Free plan cannot send email, so do not require email verification yet.
      # Set to "True" after you move to a paid plan and fill in the email settings.
      - key: ACCOUNTS_REQUIRE_EMAIL_VERIFICATION
        value: "False"
      # Adds sample content on the first deploy. Delete this variable afterwards.
      - key: SEED_SAMPLE_CONTENT
        value: "true"
      # Render asks you for these three when you create the Blueprint:
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: MAIL_TO
        sync: false