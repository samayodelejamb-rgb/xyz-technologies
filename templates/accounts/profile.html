{% extends "accounts/base_account.html" %}
{% block title %}My details | {{ site.company_name }}{% endblock %}
{% block account %}
<div class="auth-card card wide">
<h1>My details</h1>
<p class="note">Login email: <b>{{ user.email }}</b></p>
<form method="post" novalidate>
{% csrf_token %}
{% include "accounts/_form.html" with form=form %}
<button class="btn" type="submit">Save</button>
</form>
<p class="mt-m"><a href="{% url 'accounts:password_change' %}">Change my password</a></p>
</div>
{% endblock %}
